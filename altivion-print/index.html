<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Report</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }
    iframe {
      border: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
<script>
  (function () {
    const params = new URLSearchParams(window.location.search);

    // URL of the rendered HTML page (generated by the app)
    const target = params.get('url');

    // Report title to use as browser tab title / PDF file base name
    const title  = (params.get('title') || 'Report').trim() || 'Report';

    // Auto-print flag (default = 1 / true)
    const autoPrint = (params.get('print') || '1').trim();

    if (!target) {
      document.body.innerHTML = '<h1>No report URL provided.</h1>';
      return;
    }

    // Set the browser tab title (used as suggested PDF file name)
    document.title = title;

    // Create a full-page iframe with the target URL
    const frame = document.createElement('iframe');
    frame.src = target;

    frame.onload = function () {
      // Once the iframe content is loaded, print this wrapper page.
      // The iframe fills the page, so the printout will show its content.
      if (/^(1|true|yes)$/i.test(autoPrint)) {
        setTimeout(function () {
          try { window.print(); } catch (e) {}
        }, 300);
      }
    };

    document.body.appendChild(frame);
  })();
</script>
</body>
</html>
